name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - label: Linux
            os: ubuntu-22.04
            args: ""
            rust-target: ""
          - label: Windows
            os: windows-latest
            args: ""
            rust-target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --foreground-scripts

      # `createUpdaterArtifacts` is on, so a build without the signing key fails deep inside the
      # bundler with a message about a public key having been found. Catching it here costs one
      # step and turns twenty minutes of confused log-reading into one sentence.
      - name: The updater signing key is present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set on this repository."
            echo "The application ships an updater public key, so every release must be signed"
            echo "with the matching private key or installed copies can never update."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "See docs/runbooks/release.md for how the key is generated and stored."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater signing key. Held only in this secret store and in an offline backup —
          # never on a developer machine, never in the repository. See docs/runbooks/release.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: SheetForge __VERSION__
          releaseBody: |
            See [CHANGELOG.md](https://github.com/ibuilder/SheetForge/blob/main/CHANGELOG.md).

            **These binaries are not yet code-signed with an organisation certificate**, so Windows
            SmartScreen and macOS Gatekeeper will warn on first run. Verify the checksums below
            before installing. Tracked in `docs/runbooks/release.md`.
          # Draft, always. Publishing is a human act after the clean-VM checklist in the runbook.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
