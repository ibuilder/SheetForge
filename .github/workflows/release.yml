name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true
      unsigned:
        description: >-
          Build without updater artifacts, for when the signing key is not available. Produces
          installers that CANNOT self-update — every copy installed from them is stranded on this
          version until somebody reinstalls by hand. For a preview or an internal trial, not for a
          release people are meant to keep.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - label: Linux
            os: ubuntu-22.04
            args: ""
            rust-target: ""
          - label: Windows
            os: windows-latest
            args: ""
            rust-target: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --foreground-scripts

      # `createUpdaterArtifacts` is on, so a build without the signing key fails deep inside the
      # bundler with a message about a public key having been found. Catching it here costs one
      # step and turns twenty minutes of confused log-reading into one sentence.
      - name: The updater signing key is present
        if: inputs.unsigned != true
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set on this repository."
            echo "The application ships an updater public key, so every release must be signed"
            echo "with the matching private key or installed copies can never update."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "See docs/runbooks/release.md for how the key is generated and stored."
            exit 1
          fi

      # Two builds, one workflow. The signed one is the real thing; the unsigned one exists so a
      # release is possible on a day the key is not to hand, and is labelled so nobody mistakes one
      # for the other. Split rather than made conditional inside a single step, because the
      # difference is what the build *produces* and burying that in an expression is how somebody
      # ships an unsigned build believing it was signed.
      - name: Build and draft the release
        if: inputs.unsigned != true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater signing key. Held only in this secret store and in an offline backup —
          # never on a developer machine, never in the repository. See docs/runbooks/release.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: SheetForge __VERSION__
          releaseBody: |
            See [CHANGELOG.md](https://github.com/ibuilder/SheetForge/blob/main/CHANGELOG.md).

            **These binaries are not yet code-signed with an organisation certificate**, so Windows
            SmartScreen and macOS Gatekeeper will warn on first run. Verify what you downloaded
            against `SHA256SUMS.txt`, attached to this release. Tracked in
            `docs/runbooks/release.md`.

            Every file here also carries signed build provenance. To confirm one was built by
            this repository's release workflow and has not been altered since:
            `gh attestation verify <file> --repo ibuilder/SheetForge`. `SBOM.cdx.json` lists
            what the installers contain.
          # Draft, always. Publishing is a human act after the clean-VM checklist in the runbook.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build and draft the release, unsigned
        if: inputs.unsigned == true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: SheetForge __VERSION__ (unsigned preview)
          releaseBody: |
            **This build cannot update itself.** It was produced without the updater signing key,
            so it carries no signed update payload and no `latest.json`. Anything installed from it
            stays on this version until it is uninstalled and replaced by hand. It is a preview, not
            a release to keep.

            These binaries are also not code-signed with an organisation certificate, so Windows
            SmartScreen and macOS Gatekeeper will warn on first run. Nothing vouches for these
            bytes but the hash: verify what you downloaded against `SHA256SUMS.txt`, attached to
            this release.

            Every file here also carries signed build provenance. To confirm one was built by
            this repository's release workflow and has not been altered since:
            `gh attestation verify <file> --repo ibuilder/SheetForge`. `SBOM.cdx.json` lists
            what the installers contain.

            See [CHANGELOG.md](https://github.com/ibuilder/SheetForge/blob/main/CHANGELOG.md), and
            [docs/status.md](https://github.com/ibuilder/SheetForge/blob/main/docs/status.md) for
            what is verified and what is not.
          releaseDraft: true
          # Marked as a prerelease as well as said in the notes. Somebody scanning a releases page
          # reads the badge, not the body.
          prerelease: true
          uploadUpdaterJson: false
          # The same override the bundle dry run uses: updater artifacts off, because producing
          # them needs the key this build does not have.
          # Relative to `projectPath`, which is where the action runs the CLI from.
          args: ${{ matrix.args }} --config src-tauri/tauri.dryrun.conf.json

  # Checksums, a bill of materials, and signed provenance — in one job, in a fixed order.
  #
  # The release notes tell people to verify their download. For an unsigned build the hash is the
  # only integrity check a downloader has, and until this job existed the notes pointed at checksums
  # that were never published. Provenance goes further: a signed statement, recorded in the public
  # Sigstore log, that these exact bytes were built by this workflow from this commit. It cannot
  # replace code signing — the operating system does not consult it — but anybody can check it with
  # `gh attestation verify`, and it needs no secret: it is signed with the workflow's own identity.
  #
  # The order is deliberate. The SBOM is made first so it is always among the files hashed; were it
  # uploaded afterwards, a re-run would hash the previous run's copy and a first run would not, and
  # the same release would get two different checksum files.
  # A release gate, and the half of the clean-machine check CI can do. Each platform's installer is
  # downloaded from the draft this run just made, installed on a fresh runner, started, confirmed to
  # have logged that it came up, and removed — see scripts/smoke-install.mjs. Checksums and
  # provenance are not published for a release that does not install and start, so a red job here
  # is visible on the draft before anybody considers publishing it.
  #
  # Apple silicon only on macOS: the runner is arm64, and the Intel build would be tested under
  # translation, which is not what an Intel Mac runs. That build is still covered by the human
  # checklist in docs/runbooks/release.md.
  smoke:
    name: Install and launch the draft (${{ matrix.label }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            pattern: "*-setup.exe"
          - label: macOS (Apple silicon)
            os: macos-latest
            pattern: "*_aarch64.dmg"
          - label: Linux
            os: ubuntu-22.04
            pattern: "*.deb"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the installer from the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.event.inputs.tag || github.ref_name }}" --pattern "${{ matrix.pattern }}" --dir bundle
      - name: A display for Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install, launch, confirm, uninstall
        run: node scripts/smoke-install.mjs bundle

  provenance:
    name: Publish checksums, SBOM and provenance
    needs: [build, smoke]
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so `contents: write` is restated. The other
    # three are what `actions/attest` needs to mint a signing identity and record the attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Byte order, not the runner's locale, so the file sorts identically wherever it is made.
      LC_ALL: C
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The resolved tree — what actually ships — rather than the ranges the manifests ask for.
      - run: npm ci --foreground-scripts

      - name: Bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: SBOM.cdx.json
          # Both off. Its default is to upload to a release by itself on release events, and a file
          # should reach a release only because this workflow names it.
          upload-artifact: false
          upload-release-assets: false

      - name: Collect every asset and hash it
        shell: bash
        run: |
          set -euo pipefail
          # Emptied, not merely created. A hosted runner starts clean, but a reused workspace would
          # still hold the last run's files and every count below would be off by them.
          rm -rf assets && mkdir assets

          # Removed first, so a re-run never hashes the previous run's copies — a SHA256SUMS that
          # lists its own former self is nonsense.
          for stale in SHA256SUMS.txt SBOM.cdx.json; do
            gh release delete-asset "$TAG" "$stale" --yes 2>/dev/null || true
          done
          (cd assets && gh release download "$TAG" --pattern '*' --clobber)

          installers=$(ls assets | wc -l)
          if [ "$installers" -eq 0 ]; then
            echo "::error::no assets found on $TAG"; exit 1
          fi
          cp SBOM.cdx.json assets/

          # Sorted, so a diff between runs means the bytes changed rather than the ordering.
          (cd assets && sha256sum -- *) > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # Refuse a partial list: one line per file hashed, and every installer plus the SBOM.
          listed=$(wc -l < SHA256SUMS.txt)
          if [ "$listed" -ne $((installers + 1)) ]; then
            echo "::error::hashed $listed files, expected $((installers + 1))"; exit 1
          fi

          # The SBOM describes the installers, not itself. The format marks each name with a space
          # (text mode, Linux) or an asterisk (binary mode, Windows); matching only the space passed
          # on the runner and silently kept the SBOM in the list when tried under Git Bash.
          grep -vE '[ *]SBOM\.cdx\.json$' SHA256SUMS.txt > installers.sha256
          if grep -q 'SBOM\.cdx\.json' installers.sha256; then
            echo "::error::the SBOM is still listed among the installers it describes"; exit 1
          fi

          gh release upload "$TAG" SHA256SUMS.txt SBOM.cdx.json --clobber

      - name: Attest where every file came from
        uses: actions/attest@v4
        with:
          subject-checksums: SHA256SUMS.txt

      - name: Attest what the installers contain
        uses: actions/attest@v4
        with:
          subject-checksums: installers.sha256
          sbom-path: SBOM.cdx.json

      # The release is still a draft here, so a failure costs nothing but a re-run — and this is the
      # last moment where that is true. It re-downloads the release and checks it as a stranger
      # would, including the one thing no build step can: that each update signature was made by the
      # key this application trusts. 0.1.0 and 0.1.1 shipped a public key whose private half nobody
      # held, and every step in this workflow passed. The runbook says to run this by hand; a
      # release that cannot self-update must not depend on somebody remembering to.
      - name: Check the draft the way a stranger would
        run: node scripts/verify-release.mjs "$TAG"
