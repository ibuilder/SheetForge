name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true
      unsigned:
        description: >-
          Build without updater artifacts, for when the signing key is not available. Produces
          installers that CANNOT self-update — every copy installed from them is stranded on this
          version until somebody reinstalls by hand. For a preview or an internal trial, not for a
          release people are meant to keep.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - label: Linux
            os: ubuntu-22.04
            args: ""
            rust-target: ""
          - label: Windows
            os: windows-latest
            args: ""
            rust-target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --foreground-scripts

      # `createUpdaterArtifacts` is on, so a build without the signing key fails deep inside the
      # bundler with a message about a public key having been found. Catching it here costs one
      # step and turns twenty minutes of confused log-reading into one sentence.
      - name: The updater signing key is present
        if: inputs.unsigned != true
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set on this repository."
            echo "The application ships an updater public key, so every release must be signed"
            echo "with the matching private key or installed copies can never update."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "See docs/runbooks/release.md for how the key is generated and stored."
            exit 1
          fi

      # Two builds, one workflow. The signed one is the real thing; the unsigned one exists so a
      # release is possible on a day the key is not to hand, and is labelled so nobody mistakes one
      # for the other. Split rather than made conditional inside a single step, because the
      # difference is what the build *produces* and burying that in an expression is how somebody
      # ships an unsigned build believing it was signed.
      - name: Build and draft the release
        if: inputs.unsigned != true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater signing key. Held only in this secret store and in an offline backup —
          # never on a developer machine, never in the repository. See docs/runbooks/release.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: SheetForge __VERSION__
          releaseBody: |
            See [CHANGELOG.md](https://github.com/ibuilder/SheetForge/blob/main/CHANGELOG.md).

            **These binaries are not yet code-signed with an organisation certificate**, so Windows
            SmartScreen and macOS Gatekeeper will warn on first run. Verify what you downloaded
            against `SHA256SUMS.txt`, attached to this release. Tracked in
            `docs/runbooks/release.md`.
          # Draft, always. Publishing is a human act after the clean-VM checklist in the runbook.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build and draft the release, unsigned
        if: inputs.unsigned == true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: SheetForge __VERSION__ (unsigned preview)
          releaseBody: |
            **This build cannot update itself.** It was produced without the updater signing key,
            so it carries no signed update payload and no `latest.json`. Anything installed from it
            stays on this version until it is uninstalled and replaced by hand. It is a preview, not
            a release to keep.

            These binaries are also not code-signed with an organisation certificate, so Windows
            SmartScreen and macOS Gatekeeper will warn on first run. Nothing vouches for these
            bytes but the hash: verify what you downloaded against `SHA256SUMS.txt`, attached to
            this release.

            See [CHANGELOG.md](https://github.com/ibuilder/SheetForge/blob/main/CHANGELOG.md), and
            [docs/status.md](https://github.com/ibuilder/SheetForge/blob/main/docs/status.md) for
            what is verified and what is not.
          releaseDraft: true
          # Marked as a prerelease as well as said in the notes. Somebody scanning a releases page
          # reads the badge, not the body.
          prerelease: true
          uploadUpdaterJson: false
          # The same override the bundle dry run uses: updater artifacts off, because producing
          # them needs the key this build does not have.
          # Relative to `projectPath`, which is where the action runs the CLI from.
          args: ${{ matrix.args }} --config src-tauri/tauri.dryrun.conf.json

  # The release notes tell people to verify the checksums. Until this job existed they were
  # telling them to verify checksums that were never published — and for an unsigned build the
  # checksum is the *only* integrity check a downloader has, so that was the one safety net we
  # pointed at and did not provide.
  #
  # Runs after every platform has uploaded, because a SHA256SUMS covering half the assets is worse
  # than none: it looks complete.
  checksums:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect every asset and hash it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets

          # `--pattern '*'` still skips the checksum file itself on a re-run, because it is
          # deleted first — a SHA256SUMS that lists its own previous self is nonsense.
          gh release delete-asset "$TAG" SHA256SUMS.txt --yes 2>/dev/null || true
          gh release download "$TAG" --pattern '*' --clobber

          # Sorted, so the file is stable between runs and a diff means the bytes changed rather
          # than the ordering did.
          sha256sum $(ls | sort) > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

          # Refuse to publish a partial list. Nine assets today; the check is that the count
          # matches what was downloaded, not a hardcoded number that rots.
          downloaded=$(ls assets | wc -l)
          listed=$(wc -l < SHA256SUMS.txt)
          if [ "$downloaded" -ne "$listed" ]; then
            echo "::error::hashed $listed of $downloaded assets"; exit 1
          fi
          if [ "$downloaded" -eq 0 ]; then
            echo "::error::no assets found on $TAG"; exit 1
          fi

          gh release upload "$TAG" SHA256SUMS.txt --clobber
