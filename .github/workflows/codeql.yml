name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published rule finds an old bug without waiting for the next commit.
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CodeQL has no Rust analysis; `cargo clippy -D warnings` and `cargo deny` cover that side
        # in the CI workflow.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
