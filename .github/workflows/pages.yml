name: Documentation site

on:
  push:
    branches: [main]
    # Every file build-site.mjs renders, not just the obvious ones. The root documents were missing,
    # so a commit touching only CHANGELOG.md or SECURITY.md left the published copy stale.
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one mid-flight — a half-deployed site is worse than
# a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --foreground-scripts
      # Renders the repository's own Markdown through one shell, so the docs on the site and the
      # docs a contributor reads are the same files and cannot drift.
      - run: npm run site:build
      # A rename that orphans a cross-reference fails the build rather than shipping a 404.
      - run: npm run site:check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
