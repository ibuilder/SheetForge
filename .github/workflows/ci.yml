name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch. Release runs are a different
# workflow and are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are useless to CI and cost minutes of I/O on every job.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The drawing engine is a git dependency with a build step, so install scripts have to be
      # allowed for it specifically. `package.json` pins which package and which commit.
      - run: npm ci --foreground-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: No copyleft in the installed tree
        run: node scripts/check-licences.mjs
      # The tutorial sheet is committed so a Rust-only build needs no Node, and regenerated here so
      # the committed file cannot drift from the script that is supposed to describe it. The
      # generator is deterministic — no date, no random — so any difference is a real one.
      - name: The tutorial sheet matches its generator
        run: npm run check:welcome

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --foreground-scripts
      - run: npx playwright install --with-deps chromium
      # The half a headless DOM cannot reach: the engine mounting, the bundled pdf.js worker
      # starting, and real pixels landing on a canvas. Runs against the built bundle, so what is
      # tested is what ships.
      - run: npm run test:e2e -w @sheetforge/ui
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The store and package crates touch the filesystem, and path handling is exactly where
        # platforms differ, so they are tested on all three rather than on Linux alone.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # advisories: known vulnerabilities. bans: duplicate versions.
          # licenses: the no-copyleft rule from ADR-0008. sources: only crates.io.
          command: check advisories bans licenses sources

  audit:
    name: JavaScript advisories
    runs-on: ubuntu-latest
    # The Rust half of the tree has been checked for known vulnerabilities since the first commit
    # and the JavaScript half never was, which is how a high-severity arbitrary-execution advisory
    # against pdf.js sat in the lockfile until GitHub mentioned it on a push. pdf.js is the single
    # most security-critical dependency here: it is the thing that parses the hostile input this
    # whole application is built around. Finding out from a push warning is finding out too late.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `high` rather than `low`. A gate that fires on every transitive advisory in a build tool
      # is a gate people learn to skip, and a check nobody reads is worse than no check — it
      # looks like coverage. Raise the bar here rather than adding a growing ignore list.
      - run: npm audit --audit-level=high

  sbom:
    name: Bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Installed first so the SBOM covers the *resolved* tree — the transitive dependencies that
      # actually ship — rather than the ranges the manifests ask for.
      - run: npm ci --foreground-scripts
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sheetforge-sbom.cyclonedx.json
          output-file: sheetforge-sbom.cyclonedx.json
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sheetforge-sbom.cyclonedx.json
          retention-days: 90

  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --foreground-scripts
      # Compiles the whole application without producing installers. Bundling is the release
      # workflow's job; this proves the shell builds on every platform on every pull request.
      - run: npm run tauri -- build --debug --no-bundle
