[package]
name = "sf-security"
description = "SheetForge hostile-input bounds, path containment and capability model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Internal to the application, not a crates.io library. Marked explicitly so a stray
