[package]
name = "sf-security"
description = "SheetForge hostile-input bounds, path containment and capability model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Internal to the application, not a crates.io library. Marked explicitly so a stray
# `cargo publish` cannot push an application internal, and so the path dependencies
# between these crates are understood as what they are rather than as wildcards.
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Property tests over the hostile-input boundary: see tests/hostile_input.rs for why this surface
# needs generated inputs rather than only the cases somebody thought of.
proptest = "1"
tempfile.workspace = true
